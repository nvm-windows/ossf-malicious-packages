name: Refresh malware feed cache

on:
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    name: Rewrite stored cache headers
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment: publish
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Rewrite object cache headers and lifecycle
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_CDN_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_CDN_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_CDN_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_CDN_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: python scripts/refresh_object_cache.py
