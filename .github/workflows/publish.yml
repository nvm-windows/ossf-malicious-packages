name: Publish malicious package feed

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  id-token: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  COSESIGNTOOL_VERSION: "v1.7.6-pre2"
  COSESIGNTOOL_TOOLS_DIR: ${{ github.workspace }}\.tools\cosesigntool

jobs:
  check:
    name: Check the feed builder
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Check the CBOR encoder and fixture
        run: |
          python scripts/build_feed.py --self-test
          python scripts/build_feed.py --upstream fixtures/upstream --policy policy --state state.json --out dist/fixture --published 1700000000
          $status = Get-Content dist/fixture/status.json -Raw | ConvertFrom-Json
          if ($status.outcome -ne "ready") { throw "fixture did not become ready: $($status.outcome)" }
          if ($status.entry_count -ne 2) { throw "fixture entry count $($status.entry_count)" }

  publish:
    name: Generate and publish
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: publish
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Clone OpenSSF malicious packages
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # --no-checkout avoids Windows failing on ':' in unrelated Maven paths.
          git clone --filter=blob:none --sparse --depth 1 --no-checkout https://github.com/ossf/malicious-packages.git upstream
          git -C upstream sparse-checkout set --cone osv/malicious/npm osv/withdrawn/npm
          git -C upstream checkout
          if (-not (Test-Path -LiteralPath "upstream/osv/malicious/npm" -PathType Container)) {
            throw "sparse checkout did not materialize osv/malicious/npm"
          }
          git -C upstream rev-parse HEAD | Set-Content -Encoding ascii upstream-sha.txt
          git -C upstream show -s --format=%cI HEAD | Set-Content -Encoding ascii upstream-time.txt

      - name: Restore previous entries
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: state/entries.cbor.gz
          key: feed-entries-${{ hashFiles('state.json') }}

      - name: Build the feed
        id: build
        run: |
          $published = [int][DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $sha = (Get-Content upstream-sha.txt -Raw).Trim()
          $time = (Get-Content upstream-time.txt -Raw).Trim()
          $buildArgs = @(
            "scripts/build_feed.py",
            "--upstream", "upstream",
            "--policy", "policy",
            "--state", "state.json",
            "--out", "dist",
            "--production",
            "--published", "$published",
            "--upstream-sha", $sha,
            "--upstream-commit-time", $time
          )
          if (Test-Path -LiteralPath "state/entries.cbor.gz" -PathType Leaf) {
            $buildArgs += @("--previous", "state/entries.cbor.gz")
          }
          python @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $status = Get-Content dist/status.json -Raw | ConvertFrom-Json
          "outcome=$($status.outcome)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload generated files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: malicious-feed
          path: dist
          if-no-files-found: error

      - name: Open or update a review issue
        if: steps.build.outputs.outcome == 'held'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $status = Get-Content dist/status.json -Raw | ConvertFrom-Json
          $body = @"
          The publish at seq $($status.seq) is held.
          Entry count: $($status.entry_count)
          Set publish_oversize to true in policy/approvals.json only after the size is reviewed. High-impact ALL blocks stay out until their MAL IDs are listed in mal_ids.
          "@
          gh label create feed-review --color B60205 --description "Feed publish needs a person" 2>$null
          $existing = gh issue list --label feed-review --state open --json number --jq ".[0].number"
          if ($existing) {
            gh issue comment $existing --body $body
          } else {
            gh issue create --title "Feed publish held" --label feed-review --body $body
          }

      - name: Install CoseSignTool
        if: steps.build.outputs.outcome == 'ready'
        run: |
          $toolsDir = $env:COSESIGNTOOL_TOOLS_DIR
          $exe = Join-Path $toolsDir "CoseSignTool.exe"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            $url = "https://github.com/microsoft/CoseSignTool/releases/download/$($env:COSESIGNTOOL_VERSION)/CoseSignTool-Windows-release.zip"
            $zipPath = Join-Path $env:RUNNER_TEMP "CoseSignTool.zip"
            Invoke-WebRequest -Uri $url -OutFile $zipPath
            $extractDir = Join-Path $env:RUNNER_TEMP "cosesigntool"
            Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force
            $extracted = Get-ChildItem -LiteralPath $extractDir -Filter "CoseSignTool.exe" -Recurse -File | Select-Object -First 1
            Copy-Item -LiteralPath $extracted.FullName -Destination $exe -Force
            Get-ChildItem -LiteralPath $extracted.Directory.FullName -File | ForEach-Object { Copy-Item $_.FullName (Join-Path $toolsDir $_.Name) -Force }
          }

      - name: Azure login
        if: steps.build.outputs.outcome == 'ready'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign head.cose
        if: steps.build.outputs.outcome == 'ready'
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          & .\scripts\Sign-Head.ps1 -PayloadPath dist/v1/head-payload.cbor -OutputPath dist/v1/head.cose

      - name: Upload to R2
        if: steps.build.outputs.outcome == 'ready'
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_CDN_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_CDN_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_CDN_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_CDN_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_ENDPOINT }}
        run: python scripts/upload_r2.py dist

      - name: Stage entries cache
        if: steps.build.outputs.outcome == 'ready'
        run: |
          New-Item -ItemType Directory -Force -Path state | Out-Null
          Copy-Item dist/entries.cbor.gz state/entries.cbor.gz -Force

      - name: Save entries for the next diff
        if: steps.build.outputs.outcome == 'ready'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: state/entries.cbor.gz
          key: feed-entries-${{ hashFiles('dist/state.json') }}

      - name: Commit published state
        if: steps.build.outputs.outcome == 'ready'
        run: |
          Copy-Item dist/state.json state.json -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "chore: record published feed state"
          git push
