name: Watch the malicious package feed

on:
  workflow_dispatch:
  schedule:
    - cron: "29 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: feed-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    name: Check head age, cache, and holds
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run the watchdog
        env:
          GH_TOKEN: ${{ github.token }}
          WATCHDOG_LICENSE_JWT: ${{ secrets.WATCHDOG_LICENSE_JWT }}
        run: python scripts/watchdog.py --state state.json
